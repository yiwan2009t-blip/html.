            <titile>การแสดงรายการโดยใช้ตัวเลขเรียงลำดับ</titile>
    </HEAD>
    <BODY>
        <OL TYPE=i START=2><B>เลือกให้เป็น</B>
        <LI>ถึงยามได้ ได้ให้ดี ไม่มีทุกข์
            <LI>ถึงยามเป็น เป็นให้ถูก ตามวิถี
                <LI>ถึงยามตาย ตายอย่างเป็น เห็นสุขดี
                    <LI>ได้อย่างนี้ไม่มีทุกข์ ทุกเวลา
        </OL>
    </BODY>
